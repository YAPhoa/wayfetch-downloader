[package]
name = "wayfetchd"
description = "Headless Wayfetch Downloader daemon with an authenticated HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-api.workspace = true
wayfetch-engine.workspace = true
wayfetch-host.workspace = true
clap.workspace = true
httparse.workspace = true
# Embeds the web UI in every build; `debug-embed` keeps debug builds from
# reading it from the source tree at run time.
rust-embed = { version = "8.13.0", features = ["debug-embed", "include-exclude"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
url.workspace = true

[dev-dependencies]
wayfetch-net.workspace = true
wayfetch-protocol.workspace = true
bytes.workspace = true
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
rcgen.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
uuid.workspace = true

[lints]
workspace = true
