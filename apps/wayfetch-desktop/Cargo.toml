[package]
name = "wayfetch-desktop"
description = "Desktop host embedding the Wayfetch Downloader engine behind constrained IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-engine.workspace = true
wayfetch-host.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The WebView shell (architecture brief section 4.4). Only what a Linux
# window needs: no tray, no dynamic capabilities, assets always embedded.
tauri = { version = "2.12.4", default-features = false, features = ["wry", "compression", "x11", "custom-protocol"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# The native folder dialog, with the GTK 3 backend the WebView already
# links; no XDG portal or D-Bus stack (see src/picker.rs).
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
# Opens a finished download, or the folder holding it, through the
# desktop's own handler (xdg-open) with the path as one argument;
# never a shell command line (see src/ipc.rs).
opener = { version = "0.9.0", default-features = false }

[features]
# Replaces the folder dialog with a scripted answer, for the real-window
# tests only; no build ships with it.
scripted-picker = []

[dev-dependencies]
wayfetch-adapters.workspace = true
wayfetch-net.workspace = true
wayfetch-protocol.workspace = true
bytes.workspace = true
httparse.workspace = true
# A WebDriver client, to drive the real window through WebKitWebDriver.
fantoccini = { version = "0.22.1", default-features = false }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
url.workspace = true
# Closes the window the way a window manager does, with WM_DELETE_WINDOW.
x11rb = { version = "0.13.2", default-features = false }

[build-dependencies]
tauri-build = { version = "2.7.3", default-features = false, features = ["config-json"] }

[lints]
workspace = true
