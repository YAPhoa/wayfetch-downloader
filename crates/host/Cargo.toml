[package]
name = "wayfetch-host"
description = "Shared composition-root pieces for Wayfetch Downloader application hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-engine.workspace = true
wayfetch-net.workspace = true
clap.workspace = true
# Deserializes `[network] allow_networks` from the configuration file.
ipnet = { version = "2.12", features = ["serde"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
toml.workspace = true

[dev-dependencies]
rcgen = { workspace = true, features = ["pem"] }
tempfile.workspace = true

[lints]
workspace = true
