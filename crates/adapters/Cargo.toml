[package]
name = "wayfetch-adapters"
description = "Provider integrations for the Wayfetch Downloader engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-engine.workspace = true
bytes.workspace = true
hex = "0.4.3"
# Verifies plugin releases' signatures; no compression or extra algorithms.
pgp = { version = "0.21", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
url.workspace = true
zeroize = "1.9.1"

# Confines 7-Zip (architecture brief section 9.3): Landlock for files,
# seccomp to refuse sockets, and resource limits on the child.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.190"
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
seccompiler = "0.5.0"

[dev-dependencies]
httparse.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
wayfetch-net.workspace = true

[lints]
workspace = true

# Its own harness: the test program is also the launcher of confined runs.
[[test]]
name = "confined"
harness = false
