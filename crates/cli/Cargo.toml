[package]
name = "wayfetch-cli"
description = "Foreground command-line host for the Wayfetch Downloader engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "wayfetch"
path = "src/main.rs"

[dependencies]
wayfetch-engine.workspace = true
wayfetch-host.workspace = true
bytes.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
wayfetch-net.workspace = true
wayfetch-protocol.workspace = true
httparse.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true

[lints]
workspace = true
