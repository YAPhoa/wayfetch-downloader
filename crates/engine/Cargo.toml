[package]
name = "wayfetch-engine"
description = "Reusable Wayfetch Downloader engine library and lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-domain.workspace = true
wayfetch-protocol.workspace = true
bytes.workspace = true
cap-std.workspace = true
# The tokenizer under scraper, already in the tree: tells pasted markup
# from text by the tags actually written, which a parsed tree cannot.
html5ever = "0.39.0"
# Finds links in pasted text, with their boundaries against punctuation.
linkify = "0.11.0"
percent-encoding.workspace = true
rangemap.workspace = true
# Credential encryption and key derivation; already in the tree through
# rustls, so no new cryptography is added.
ring = "0.17.14"
rusqlite.workspace = true
rusqlite_migration.workspace = true
# Reads pasted HTML and fetched pages into a document for finding links;
# its CSS selectors and forms serve crawler rules later. Without the
# command-line tool, which is all its default features add.
scraper = { version = "0.27.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
# The host supplies the runtime; the engine only spawns onto its handle.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
# Wipes secrets from memory once dropped.
zeroize = "1.9.1"
fail = { version = "0.5.1", optional = true }

[features]
# Named fault-injection points: crash boundaries for process-kill tests
# (architecture brief section 13.2) and a hung folder. Test-only: no host
# enables it.
failpoints = ["dep:fail", "fail/failpoints"]
# TypeScript declarations of the protocol's wire types, for the UI.
ts = ["wayfetch-protocol/ts"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
