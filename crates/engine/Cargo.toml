[package]
name = "wayfetch-engine"
description = "Reusable Wayfetch Downloader engine library and lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-domain.workspace = true
wayfetch-protocol.workspace = true
bytes.workspace = true
cap-std.workspace = true
percent-encoding.workspace = true
rangemap.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
# The host supplies the runtime; the engine only spawns onto its handle.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
fail = { version = "0.5.1", optional = true }

[features]
# Named crash-injection boundaries for process-kill tests (architecture brief
# section 13.2). Test-only: no host enables it.
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
