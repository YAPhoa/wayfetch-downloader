[package]
name = "wayfetch-net"
description = "HTTP transport and request broker for the Wayfetch Downloader engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-engine.workspace = true
bytes.workspace = true
httpdate = "1"
ipnet = "2"
percent-encoding.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
url.workspace = true

[dev-dependencies]
httparse = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wayfetch-protocol.workspace = true

[lints]
workspace = true
