[package]
name = "wayfetch-protocol"
description = "Transport-neutral Wayfetch Downloader commands, queries, errors, and events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayfetch-domain = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

[features]
# TypeScript declarations of the wire types, for the UI. `cargo test
# --features ts` writes them (see .cargo/config.toml).
ts = ["dep:ts-rs", "ts-rs/uuid-impl", "wayfetch-domain/ts"]

[lints]
workspace = true
