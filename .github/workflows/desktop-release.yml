name: Desktop release

# Builds the Linux desktop packages with deploy/desktop-release.sh and
# attaches them to a draft GitHub release for the tag; publishing the
# draft stays a person's decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported base with WebKitGTK 4.1: the packages need its
    # glibc or newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          }
      - name: Install WebView libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - name: Install pinned toolchain and the Tauri CLI
        run: |
          rustup toolchain install
          cargo install tauri-cli --version 2.12.3 --locked
      - name: Build the packages
        run: deploy/desktop-release.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/SHA256SUMS
      - name: Keep the packages of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/SHA256SUMS
