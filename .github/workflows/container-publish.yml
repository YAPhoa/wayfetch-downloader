name: Container image

on:
  pull_request:
    paths:
      - '.github/workflows/container-publish.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'apps/wayfetchd/tests/container.rs'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source to publish: main (edge) or a version tag such as v0.1.0'
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: container-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Image names and source metadata
        id: image
        env:
          SOURCE_REF: ${{ inputs.ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision=$(git rev-parse HEAD)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$EVENT" = pull_request ]; then
            tag="pr-${{ github.event.pull_request.number }}"
          elif [ "$SOURCE_REF" = main ]; then
            tag=edge
          else
            test "$SOURCE_REF" = "v$version" || {
              echo "Choose main or the workspace version tag v$version" >&2
              exit 1
            }
            test "$(git rev-parse "refs/tags/$SOURCE_REF^{commit}")" = "$revision"
            tag="$SOURCE_REF"
          fi
          {
            echo "name=$image"
            echo "revision=$revision"
            echo "version=$version"
            echo 'tags<<TAGS'
            echo "$image:$tag"
            echo "$image:sha-$revision"
            if [ "$EVENT" = release ] && [ "$PRERELEASE" = false ]; then
              echo "$image:latest"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wayfetch:ci
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test the image with Compose
        env:
          WAYFETCH_IMAGE: wayfetch:ci
        run: cargo test --locked -p wayfetchd --test container -- --include-ignored --test-threads=1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
