name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository hygiene
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          reserved = {'evidence', 'reports', 'handoffs', 'review-notes', 'artifacts'}
          errors = []
          for name in filter(None, tracked):
              parts = PurePosixPath(name).parts
              if reserved.intersection(parts[:-1]) or name.startswith('.local/agent-runs/'):
                  errors.append(f'Reserved agent-output path is tracked: {name}')
          status = Path('STATUS.md')
          if status.is_file() and len(status.read_text().splitlines()) > 80:
              errors.append('STATUS.md exceeds 80 lines')
          for error in errors:
              print(error, file=sys.stderr)
          if errors:
              sys.exit(1)
          print('Repository hygiene checks passed')
          PYTHON

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # With no arguments rustup installs the toolchain in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Engine-only build
        run: cargo build --locked -p wayfetch-engine
      - name: Dependency boundaries
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/check_dependency_boundaries.py
