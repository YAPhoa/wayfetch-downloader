name: Repository checks

# Branch pushes are checked through their pull request, so a PR commit
# runs once rather than twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit to the same pull request supersedes a running check;
# every commit to main is still checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check repository hygiene
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          reserved = {'evidence', 'reports', 'handoffs', 'review-notes', 'artifacts'}
          errors = []
          for name in filter(None, tracked):
              parts = PurePosixPath(name).parts
              if reserved.intersection(parts[:-1]) or name.startswith('.local/agent-runs/'):
                  errors.append(f'Reserved agent-output path is tracked: {name}')
          status = Path('STATUS.md')
          if status.is_file() and len(status.read_text().splitlines()) > 80:
              errors.append('STATUS.md exceeds 80 lines')
          for error in errors:
              print(error, file=sys.stderr)
          if errors:
              sys.exit(1)
          print('Repository hygiene checks passed')
          PYTHON

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        # With no arguments rustup installs the toolchain in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # The desktop host needs WebView libraries; the desktop job checks it.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude wayfetch-desktop --all-targets --all-features -- -D warnings
      - name: Test
        # Also writes the web UI's TypeScript declarations of the wire types,
        # from scratch so a removed type leaves no stale file.
        run: |
          rm -r ui/src/client/generated
          cargo test --locked --workspace --exclude wayfetch-desktop --all-features
      - name: Web UI wire types match the Rust definitions
        run: |
          git add --intent-to-add ui/src/client/generated
          git diff --exit-code -- ui/src/client/generated
      - name: Engine-only build
        run: cargo build --locked -p wayfetch-engine
      - name: Dependency boundaries
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/check_dependency_boundaries.py
      - name: Engine and server build without JavaScript tooling
        # Neither the engine nor wayfetchd, which embeds the web UI as it
        # is, may need Node.js or npm to build.
        run: |
          env PATH="$HOME/.cargo/bin:/usr/bin:/bin" sh -c \
            '! command -v node && ! command -v npm && cargo build --locked -p wayfetch-engine -p wayfetchd'

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install development tools
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser tests against wayfetchd
        run: |
          cargo build --locked -p wayfetchd
          npx playwright install --with-deps chromium
          npm run e2e

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install WebView libraries, WebKitWebDriver, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev webkit2gtk-driver xvfb
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -p wayfetch-desktop --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked -p wayfetch-desktop
      - name: The real window against a local fixture
        run: xvfb-run -a cargo test --locked -p wayfetch-desktop --features scripted-picker --test shell -- --ignored --test-threads=1
