[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/engine",
    "crates/net",
    "crates/host",
    "crates/cli",
    "crates/api",
    "apps/wayfetchd",
    "apps/wayfetch-desktop",
]
# Default members leave out the desktop host, which needs a WebView and its
# system libraries, so a plain `cargo build` never pulls one in.
default-members = [
    "crates/domain",
    "crates/protocol",
    "crates/engine",
    "crates/net",
    "crates/host",
    "crates/cli",
    "crates/api",
    "apps/wayfetchd",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YAPhoa/wayfetch-downloader"
publish = false

[workspace.dependencies]
wayfetch-domain = { path = "crates/domain" }
wayfetch-protocol = { path = "crates/protocol" }
wayfetch-engine = { path = "crates/engine" }
wayfetch-net = { path = "crates/net" }
wayfetch-host = { path = "crates/host" }
wayfetch-api = { path = "crates/api" }
bytes = "1.12.1"
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
httparse = "1"
percent-encoding = "2.3.2"
rangemap = "1.8.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "1.53.2", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", default-features = false }
# TypeScript declarations for the UI. ts-rs cannot follow serde's
# `try_from`/`from`/`into`; every type using them either has the same shape
# as its conversion target or names its TypeScript type with `#[ts(type)]`,
# so its warnings about them are silenced.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }

# Password hashing is deliberately slow; unoptimized, it is slow enough to
# make debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
