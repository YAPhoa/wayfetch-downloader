[workspace]
resolver = "3"
members = ["crates/domain", "crates/protocol", "crates/engine"]
# Server and desktop hosts are added as members later; default members stay
# limited to engine-side crates so a plain `cargo build` never pulls in a
# desktop or frontend toolchain.
default-members = ["crates/domain", "crates/protocol", "crates/engine"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YAPhoa/wayfetch-downloader"
publish = false

[workspace.dependencies]
wayfetch-domain = { path = "crates/domain" }
wayfetch-protocol = { path = "crates/protocol" }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.145"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.17"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
